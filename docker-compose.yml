version: "3.9"

services:

  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repograph}
      POSTGRES_DB: ${POSTGRES_DB:-repograph}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repograph}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-repograph}:${POSTGRES_PASSWORD:-repograph}@postgres:5432/${POSTGRES_DB:-repograph}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./repositories:/app/repositories
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-changeme-dev-key}
    depends_on:
      - api
    restart: unless-stopped

  # Optional: include Ollama in Docker stack with --profile with-ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - with-ollama

volumes:
  pgdata:
  ollama_models:
